name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [wasm-gc, wasm, js, native]
    steps:
      - uses: actions/checkout@v5
      - name: Install MoonBit
        uses: moonbit-community/setup-moonbit@04293a8a813bfd4b6c2fce22701b52ae1050d100
        with:
          version: latest
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve dependencies and record toolchain
        run: |
          moon version --all
          moon update
          python -m pip install -r scripts/requirements-test.txt
      - name: Format, API, strict check and build
        run: |
          moon fmt --check
          moon info
          git diff --exit-code -- '*.mbti'
          moon check --target ${{ matrix.target }} --deny-warn
          moon build --target ${{ matrix.target }} --deny-warn
      - name: Unit and invariant tests
        run: moon test --target ${{ matrix.target }} --deny-warn
      - name: Independent dateutil comparison
        run: python scripts/compare_dateutil.py --target ${{ matrix.target }} --report quality-report.json
      - name: Real CLI acceptance
        run: python scripts/check_cli.py --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: dateutil-${{ matrix.target }}
          path: quality-report.json
